# bt CLI 回测配置示例：`bt config.yml`
#
# 必填：signal（信号路径）、data.*（行情数据路径）与 period.*（回测区间）。
# 其余字段均可省略，默认值即本文件中所示（对齐 examples/run_backtest.rs）。
#
# 多配置批量：`bt a.yml b.yml ...` 一次进程跑多份配置（如参数扫描），
# 各配置的 data.* 路径须一致（wap 模式配置还须同一 deal_price 时段），
# 数据只加载一次、逐配置回测并各自导出。

# 信号 CSV 路径（必填）
signal: "tmp_data/pred.csv"

# 行情数据路径（必填）：CSV 或 parquet（按扩展名 .parquet / .pq 识别，列要求同 CSV）
data:
  stock_bar: "tmp_data/stock_bar.csv" # 股票日行情
  benchmark: "tmp_data/benchmark.csv" # 基准收益
  # wap: "tmp_data/wap.parquet"       # wap 时段数据：deal_price 为 vwapN/twapN 时必填
                                      # 时段表见 doc/specification.md "数据文件格式--wap 数据"
  # 也可改为目录自动发现：dir 指向数据目录，系统按文件名主干 stock_bar /
  # benchmark / wap 查找，扩展名优先级 .parquet > .pq > .csv；显式路径
  # 优先于目录发现（可只显式覆盖其中一项）；wap 仅在 deal_price 为
  # vwapN/twapN 时查找（目录里的 wap 文件不影响非时段价回测）
  # dir: "tmp_data"

# 回测区间（必填）：闭开区间 [start_date, end_date)，自动按交易日历对齐
period:
  start_date: "2026-01-01"
  end_date: "2026-06-01"

# 账户
account:
  initial_cash: 10000000.0           # 期初资金（1000 万）

# 策略：topk_dropout（每日卖出最差 drop_n 只持仓再补买）或
#       topk（每日持有 score 前 top_n 只，跌出才卖出）
strategy:
  name: "topk_dropout"
  top_n: 100                         # 目标持仓只数
  drop_n: 100                        # 每个调仓日计划卖出的只数（仅 topk_dropout）
  only_tradable: false               # 卖出候选限定当日可交易股票（仅 topk_dropout）
  forbid_st: false                   # 禁止买入 ST 股

# 交易所（撮合与成本）
exchange:
  deal_price: "open"                 # 成交价：open / close / vwap / vwapN / twapN
                                     # （N = 1..=11 时段价，需 data.wap；时段表见 doc/specification.md）
  open_cost: 0.00015                 # 买入费率（万 1.5）
  close_cost: 0.00065                # 卖出费率（佣金 + 印花税，万 6.5）
  min_cost: 5.0                      # 单笔最低费用
  fixed_slippage: 0.01               # 固定滑点
  min_slippage_ratio: 0.0014         # 最小滑点比例
  volume_threshold: 0.5              # 成交量限制比例（null 表示不限制）
  limit_threshold: 0.0985            # 涨跌停判定阈值（null 表示不限制）

# 报告
report:
  benchmark: "zz1000"                # 基准名称
  excess_method: "arithmetic"        # 超额计算：arithmetic / geometric

# 输出产物
output:
  dir: "output"                      # 输出目录（不存在时自动创建）
  hist_position: "hist_position.csv" # 逐日持仓快照
  trades: "trades.csv"               # 成交记录（含未成交）
  report_data: "report_data.csv"     # 逐 bar 原始指标
  report_plot: "report_plot.html"    # 交互式 HTML 报告

# 终端进度条
progress: true
